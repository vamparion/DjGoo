server:
  port: 2333
  address: "::1"

lavalink:
  server:
    password: "youshallnotpass"
    sources:
      # The bundled youtube-source plugin replaces Lavalink's deprecated parser.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

logging:
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: false

metrics:
  prometheus:
    enabled: false

plugins:
  youtube:
    enabled: true
    remoteCipher:
      url: https://cipher.kikkia.dev/
      userAgent: DjGoo
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - WEBEMBEDDED
      - ANDROID_VR
      - ANDROID_MUSIC
      - TVHTML5_SIMPLY
      - TV
      - IOS
      - WEB
      - MWEB
