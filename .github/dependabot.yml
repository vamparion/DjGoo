version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      runtime-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest*"
          - "PyInstaller"
      test-and-release-tools:
        patterns:
          - "pytest*"
          - "PyInstaller"
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/relay"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: "America/Chicago"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - relay
    commit-message:
      prefix: "relay-deps"
