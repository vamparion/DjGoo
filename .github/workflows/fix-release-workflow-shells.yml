name: Repair release workflow shells

on:
  push:
    branches:
      - main
    paths:
      - tools/fix_release_workflow_shells.py
      - .github/workflows/fix-release-workflow-shells.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPAIR_BRANCH: release/alpha25-shell-fix-generated
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite release PowerShell shells
        run: python tools/fix_release_workflow_shells.py

      - name: Publish repair branch and pull request
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$REPAIR_BRANCH"
          git add .github/workflows/fast-app-release.yml \
                  .github/workflows/portable-release.yml \
                  .github/workflows/repair-release-assets.yml
          git diff --cached --check
          git commit -m "Run release workflows with PowerShell bypass"
          git push --force origin "HEAD:$REPAIR_BRANCH"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$REPAIR_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$REPAIR_BRANCH" \
              --title "Run alpha.25 release workflows with PowerShell bypass" \
              --body "AEGIS blocks temporary PowerShell scripts under its machine execution policy. This applies the explicit -ExecutionPolicy Bypass shell already used by trusted CI to every fast release, full package, and final verifier PowerShell step."
          fi
