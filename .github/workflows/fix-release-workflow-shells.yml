name: Repair release workflow shells

on:
  push:
    branches:
      - main
    paths:
      - tools/fix_release_workflow_shells.py
      - tools/publish_release_shell_repair.py
      - .github/workflows/fix-release-workflow-shells.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPAIR_BRANCH: release/alpha25-shell-fix-generated
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite release PowerShell shells
        shell: cmd
        run: python tools\fix_release_workflow_shells.py

      - name: Publish repair branch and pull request
        shell: cmd
        run: python tools\publish_release_shell_repair.py
