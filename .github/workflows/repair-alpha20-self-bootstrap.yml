name: Repair alpha.20 self-bootstrapping Host updater

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/complete_launcher_update.py
      - tools/djgoo_portable_stack_entry.py
      - tests/test_launcher_update_completion.py
      - .github/workflows/repair-alpha20-self-bootstrap.yml
      - .alpha20-self-bootstrap-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-alpha20-self-bootstrap
  cancel-in-progress: true

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out bootstrap tooling
        uses: actions/checkout@v4

      - name: Publish and verify self-bootstrapping alpha.20 Host updater
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v0.3.0-alpha.20"
          $version = "0.3.0-alpha.20"

          Remove-Item repair, build, published-check -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force repair, repair/host, build, published-check | Out-Null

          gh release download $tag -R $env:GITHUB_REPOSITORY `
            --pattern "DjGoo-Host-win-x64.zip" `
            --pattern "SHA256SUMS.txt" `
            --dir repair `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the published alpha.20 Host package and checksums."
          }
          foreach ($path in @(
            "repair/DjGoo-Host-win-x64.zip",
            "repair/SHA256SUMS.txt"
          )) {
            if (!(Test-Path $path) -or (Get-Item $path).Length -le 0) {
              throw "Published alpha.20 source asset is missing or empty: $path"
            }
          }

          Expand-Archive repair/DjGoo-Host-win-x64.zip repair/host -Force
          $hostExe = Get-ChildItem repair/host -Recurse -File -Filter "DjGoo.exe" | Select-Object -First 1
          if (-not $hostExe) {
            throw "The alpha.20 Host package does not contain DjGoo.exe."
          }
          $packageRoot = $hostExe.Directory.FullName
          $miniPlayer = Join-Path $packageRoot "DjGoo Mini Player.exe"
          if (!(Test-Path $miniPlayer)) {
            throw "The alpha.20 Host package does not contain DjGoo Mini Player.exe."
          }

          Copy-Item tools/complete_launcher_update.py `
            "$packageRoot/tools/complete_launcher_update.py" -Force
          Copy-Item tools/djgoo_portable_stack_entry.py `
            "$packageRoot/tools/djgoo_portable_stack_entry.py" -Force
          Copy-Item tools/djgoo_portable_stack_entry.py `
            "$packageRoot/tools/djgoo_stack.py" -Force
          New-Item -ItemType Directory -Force `
            "$packageRoot/tools/pending_launchers" | Out-Null
          Copy-Item $hostExe.FullName `
            "$packageRoot/tools/pending_launchers/DjGoo.exe" -Force
          Copy-Item $miniPlayer `
            "$packageRoot/tools/pending_launchers/DjGoo Mini Player.exe" -Force

          python tools/build_update_bundle.py `
            --package-root $packageRoot `
            --output-zip build/DjGoo-Host-update.zip `
            --output-manifest build/DjGoo-Host-update.json `
            --version $version `
            --defer-launchers
          if ($LASTEXITCODE -ne 0) {
            throw "Self-bootstrapping alpha.20 Host updater build failed."
          }

          python -c "import json,zipfile; from pathlib import Path; p=json.loads(Path('build/DjGoo-Host-update.json').read_text()); z=zipfile.ZipFile('build/DjGoo-Host-update.zip'); names=set(z.namelist()); required={'tools/pending_launchers/DjGoo.exe','tools/pending_launchers/DjGoo Mini Player.exe','tools/complete_launcher_update.py','tools/djgoo_stack.py','tools/apply_update.py'}; assert p['version']=='0.3.0-alpha.20'; assert p['release_tag']=='v0.3.0-alpha.20'; assert p['launcher_update_deferred'] is True; assert 'DjGoo.exe' not in names; assert 'DjGoo Mini Player.exe' not in names; assert required <= names, sorted(required-names); assert b'schedule_pending_launcher_completion' in z.read('tools/djgoo_stack.py'); assert b'wait_for_launcher_release' in z.read('tools/apply_update.py'); assert b'complete_launcher_update' in z.read('tools/complete_launcher_update.py'); print('alpha.20 self-bootstrapping Host updater verified')"
          if ($LASTEXITCODE -ne 0) {
            throw "The alpha.20 self-bootstrap bundle contract is invalid."
          }

          $checksumMap = @{}
          foreach ($line in Get-Content repair/SHA256SUMS.txt) {
            if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$') {
              $checksumMap[$Matches[2].Trim()] = $Matches[1].ToLowerInvariant()
            }
          }
          $checksumMap["DjGoo-Host-update.zip"] = `
            (Get-FileHash build/DjGoo-Host-update.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumMap["DjGoo-Host-update.json"] = `
            (Get-FileHash build/DjGoo-Host-update.json -Algorithm SHA256).Hash.ToLowerInvariant()
          $orderedAssets = @(
            "DjGoo-Host-win-x64.zip",
            "DjGoo-Voice-win-x64.zip",
            "DjGoo-Host-update.zip",
            "DjGoo-Host-update.json",
            "DjGoo-Voice-update.zip",
            "DjGoo-Voice-update.json"
          )
          $missingChecksums = @($orderedAssets | Where-Object { !$checksumMap.ContainsKey($_) })
          if ($missingChecksums.Count -gt 0) {
            throw "Existing alpha.20 checksum inventory is incomplete: $($missingChecksums -join ', ')"
          }
          @($orderedAssets | ForEach-Object { "$($checksumMap[$_])  $_" }) | `
            Set-Content -Encoding ASCII build/SHA256SUMS.txt

          gh release upload $tag `
            build/DjGoo-Host-update.zip `
            build/DjGoo-Host-update.json `
            build/SHA256SUMS.txt `
            -R $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub rejected the self-bootstrapping alpha.20 Host updater."
          }

          gh release download $tag -R $env:GITHUB_REPOSITORY `
            --pattern "DjGoo-Host-update.zip" `
            --pattern "DjGoo-Host-update.json" `
            --pattern "SHA256SUMS.txt" `
            --dir published-check `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "The repaired alpha.20 Host updater could not be downloaded."
          }
          foreach ($name in @(
            "DjGoo-Host-update.zip",
            "DjGoo-Host-update.json",
            "SHA256SUMS.txt"
          )) {
            $built = Get-FileHash "build/$name" -Algorithm SHA256
            $published = Get-FileHash "published-check/$name" -Algorithm SHA256
            if ($built.Hash -ne $published.Hash) {
              throw "The published alpha.20 $name does not match the verified build."
            }
          }
          Write-Host "Self-bootstrapping alpha.20 Host updater published, downloaded, and verified."
