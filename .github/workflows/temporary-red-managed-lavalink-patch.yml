name: Temporary Red-managed Lavalink patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-red-managed-lavalink-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/red-managed-lavalink-revert
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Apply supervisor patch
        run: python tools/_temporary_patch_red_managed.py

      - name: Commit branch patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git commit -m "delegate Lavalink lifecycle to Red Audio"
          git push origin HEAD:agent/red-managed-lavalink-revert
