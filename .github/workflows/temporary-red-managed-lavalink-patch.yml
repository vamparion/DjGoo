name: Temporary Red-managed Lavalink patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-red-managed-lavalink-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/red-managed-lavalink-revert
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Patch portable supervisor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/djgoo_portable_stack.py")
          text = path.read_text(encoding="utf-8")

          import_old = "import psutil\n"
          import_new = "import psutil\n\nfrom tools.lavalink_process import cleanup_lavalink_processes\n"
          if "from tools.lavalink_process import cleanup_lavalink_processes" not in text:
              if import_old not in text:
                  raise SystemExit("psutil import anchor not found")
              text = text.replace(import_old, import_new, 1)

          running_old = '''    def portable_component_running(spec: Any) -> bool:
              if original_component_running(spec):
                  return True
              if getattr(spec, "name", "") == "lavalink":
                  return _adopt_lavalink_listener(core, spec)
              return False
          '''
          running_new = '''    def portable_component_running(spec: Any) -> bool:
              # Red Audio owns Lavalink. Keep a virtual supervisor component so
              # existing status/UI behavior remains compatible without starting
              # a second Java process.
              if getattr(spec, "name", "") == "lavalink":
                  return True
              return bool(original_component_running(spec))
          '''
          if running_old in text:
              text = text.replace(running_old, running_new, 1)
          elif running_new not in text:
              raise SystemExit("portable_component_running anchor not found")

          terminate_old = '''    def portable_terminate_component(spec: Any, reason: str) -> None:
              if getattr(spec, "name", "") == "lavalink":
                  leftovers = _matching_package_lavalink_processes(root)
              else:
                  leftovers = _matching_processes(spec)
              original_terminate_component(spec, reason)
              for process in leftovers:
                  try:
                      if not process.is_running():
                          continue
                  except psutil.Error:
                      continue
                  core.LOG.event(
                      "component.orphan_stop",
                      component=getattr(spec, "name", "unknown"),
                      pid=int(process.pid),
                      reason=reason,
                  )
                  _terminate_process_tree(process)
              core.pid_path(spec.name).unlink(missing_ok=True)
              core.health_path(spec.name).unlink(missing_ok=True)
          '''
          terminate_new = '''    def portable_terminate_component(spec: Any, reason: str) -> None:
              if getattr(spec, "name", "") == "lavalink":
                  for pid in cleanup_lavalink_processes(root):
                      core.LOG.event(
                          "component.orphan_stop",
                          component="lavalink",
                          pid=int(pid),
                          reason=reason,
                      )
                  core.pid_path(spec.name).unlink(missing_ok=True)
                  core.health_path(spec.name).unlink(missing_ok=True)
                  return

              leftovers = _matching_processes(spec)
              original_terminate_component(spec, reason)
              for process in leftovers:
                  try:
                      if not process.is_running():
                          continue
                  except psutil.Error:
                      continue
                  core.LOG.event(
                      "component.orphan_stop",
                      component=getattr(spec, "name", "unknown"),
                      pid=int(process.pid),
                      reason=reason,
                  )
                  _terminate_process_tree(process)
              core.pid_path(spec.name).unlink(missing_ok=True)
              core.health_path(spec.name).unlink(missing_ok=True)
          '''
          if terminate_old in text:
              text = text.replace(terminate_old, terminate_new, 1)
          elif terminate_new not in text:
              raise SystemExit("portable_terminate_component anchor not found")

          logger_anchor = "    core.LOG = core.Logger()\n"
          logger_new = (
              logger_anchor
              + "    core.pid_path(\"lavalink\").unlink(missing_ok=True)\n"
              + "    core.health_path(\"lavalink\").unlink(missing_ok=True)\n"
          )
          if "core.pid_path(\"lavalink\").unlink" not in text:
              if logger_anchor not in text:
                  raise SystemExit("logger anchor not found")
              text = text.replace(logger_anchor, logger_new, 1)

          ready_old = "    core.lavalink_ready = lambda: _portable_lavalink_ready(core)\n"
          ready_new = "    core.lavalink_ready = lambda: True\n"
          if ready_old in text:
              text = text.replace(ready_old, ready_new, 1)
          elif ready_new not in text:
              raise SystemExit("lavalink_ready anchor not found")

          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_portable_stack_adapter.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_name = "test_supervisor_delegates_lavalink_to_red_audio"
          if test_name not in test_text:
              test_text += '''


def test_supervisor_delegates_lavalink_to_red_audio(tmp_path, monkeypatch) -> None:
    touch(tmp_path / "runtime" / "python" / "python.exe")
    touch(tmp_path / "runtime" / "python" / "pythonw.exe")
    touch(tmp_path / "runtime" / "java" / "bin" / "java.exe")
    cleaned: list[Path] = []
    monkeypatch.setattr(
        adapter,
        "cleanup_lavalink_processes",
        lambda root: cleaned.append(Path(root)) or [],
    )

    core = adapter.configure_core(make_fake_core(), tmp_path)
    spec = SimpleNamespace(name="lavalink", command_markers=("lavalink.jar", str(tmp_path)))

    assert core.component_running(spec) is True
    assert core.lavalink_ready() is True
    core.terminate_component(spec, "test-stop")
    assert cleaned == [tmp_path.resolve()]
'''
              test_path.write_text(test_text, encoding="utf-8")
          PY

      - name: Commit branch patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/djgoo_portable_stack.py tests/test_portable_stack_adapter.py
          if git diff --cached --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git commit -m "delegate Lavalink lifecycle to Red Audio"
          git push origin HEAD:agent/red-managed-lavalink-revert
