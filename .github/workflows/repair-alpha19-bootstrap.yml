name: Repair alpha.19 bootstrap updater

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repair-alpha19-bootstrap.yml
      - .alpha19-bootstrap-trigger

permissions:
  contents: read

concurrency:
  group: alpha19-bootstrap-repair
  cancel-in-progress: true

jobs:
  repair:
    if: false
    runs-on: [self-hosted, Windows, X64]
    steps:
      - run: echo "PR 61 is superseded by PR 62; no runner allocation required."
