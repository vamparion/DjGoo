name: Repair alpha.19 bootstrap updater

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/build_update_bundle.py
      - tools/apply_update.py
      - tools/windows_firewall.py
      - local_cogs/djgoowelcome/__init__.py
      - tests/test_build_update_bundle.py
      - tests/test_apply_update_process_guard.py
      - tests/test_windows_firewall.py
      - .github/workflows/repair-alpha19-bootstrap.yml
      - .alpha19-bootstrap-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha19-bootstrap-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out bootstrap tooling
        uses: actions/checkout@v4

      - name: Build and publish launcher-deferred alpha.19 updater
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v0.3.0-alpha.19"
          $version = "0.3.0-alpha.19"

          Remove-Item repair, build -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force repair, repair/host, build | Out-Null

          $sourceTag = ""
          foreach ($candidate in @(
            "v0.3.0-alpha.19",
            "v0.3.0-alpha.18",
            "v0.3.0-alpha.17",
            "v0.3.0-alpha.16"
          )) {
            Remove-Item repair/DjGoo-Host-win-x64.zip -Force -ErrorAction SilentlyContinue
            $candidateJson = gh release view $candidate -R $env:GITHUB_REPOSITORY --json assets 2>$null
            if ($LASTEXITCODE -ne 0) {
              continue
            }
            $candidateRelease = $candidateJson | ConvertFrom-Json
            $candidateNames = @($candidateRelease.assets | ForEach-Object { [string]$_.name })
            if ($candidateNames -notcontains "DjGoo-Host-win-x64.zip") {
              continue
            }
            gh release download $candidate -R $env:GITHUB_REPOSITORY `
              --pattern "DjGoo-Host-win-x64.zip" `
              --dir repair `
              --clobber
            if (
              $LASTEXITCODE -eq 0 -and
              (Test-Path repair/DjGoo-Host-win-x64.zip) -and
              (Get-Item repair/DjGoo-Host-win-x64.zip).Length -gt 0
            ) {
              $sourceTag = $candidate
              break
            }
          }
          if (-not $sourceTag) {
            throw "No published alpha.16-alpha.19 Host package is available for bootstrap reconstruction."
          }
          Write-Host "Reconstructing alpha.19 bootstrap from $sourceTag."

          Expand-Archive repair/DjGoo-Host-win-x64.zip repair/host -Force
          $hostExe = Get-ChildItem repair/host -Recurse -File -Filter "DjGoo.exe" | Select-Object -First 1
          if (-not $hostExe) {
            throw "The selected prior Host package does not contain DjGoo.exe."
          }
          $packageRoot = $hostExe.Directory.FullName

          # The selected prior Host package contains the updater that failed in
          # production. Overlay only the recovery engine and local-firewall
          # bootstrap files from this PR. Protocol/UI changes remain alpha.20 so
          # an alpha.19 recipient never receives an invite it cannot parse.
          Copy-Item tools/apply_update.py "$packageRoot/tools/apply_update.py" -Force
          Copy-Item tools/windows_firewall.py "$packageRoot/tools/windows_firewall.py" -Force
          Copy-Item local_cogs/djgoowelcome/__init__.py `
            "$packageRoot/local_cogs/djgoowelcome/__init__.py" -Force

          python tools/build_update_bundle.py `
            --package-root $packageRoot `
            --output-zip build/DjGoo-Host-update.zip `
            --output-manifest build/DjGoo-Host-update.json `
            --version $version `
            --defer-launchers
          if ($LASTEXITCODE -ne 0) {
            throw "Launcher-deferred Host updater build failed."
          }

          python -c "import json,zipfile; from pathlib import Path; p=json.loads(Path('build/DjGoo-Host-update.json').read_text()); z=zipfile.ZipFile('build/DjGoo-Host-update.zip'); names=set(z.namelist()); assert p['launcher_update_deferred'] is True; assert 'DjGoo.exe' not in names; assert 'DjGoo Mini Player.exe' not in names; assert 'tools/apply_update.py' in names; assert b'wait_for_launcher_release' in z.read('tools/apply_update.py'); assert b'profile=any' in z.read('tools/windows_firewall.py'); assert p['release_tag']=='v0.3.0-alpha.19'; print('alpha.19 bootstrap updater verified')"
          if ($LASTEXITCODE -ne 0) {
            throw "The alpha.19 bootstrap bundle contract is invalid."
          }

          gh release upload $tag `
            build/DjGoo-Host-update.zip `
            build/DjGoo-Host-update.json `
            -R $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub rejected the alpha.19 bootstrap updater assets."
          }

          $published = gh release view $tag -R $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the repaired alpha.19 release."
          }
          $sizes = @{}
          foreach ($asset in $published.assets) {
            $sizes[[string]$asset.name] = [int64]$asset.size
          }
          foreach ($required in @("DjGoo-Host-update.zip", "DjGoo-Host-update.json")) {
            if (!$sizes.ContainsKey($required) -or $sizes[$required] -le 0) {
              throw "Repaired alpha.19 asset is missing or empty: $required"
            }
          }

          Remove-Item published-check -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force published-check | Out-Null
          gh release download $tag -R $env:GITHUB_REPOSITORY `
            --pattern "DjGoo-Host-update.zip" `
            --pattern "DjGoo-Host-update.json" `
            --dir published-check `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "The repaired alpha.19 updater could not be downloaded."
          }
          if (
            (Get-FileHash published-check/DjGoo-Host-update.zip -Algorithm SHA256).Hash -ne
            (Get-FileHash build/DjGoo-Host-update.zip -Algorithm SHA256).Hash
          ) {
            throw "The published alpha.19 updater ZIP does not match the verified build."
          }
          if (
            (Get-FileHash published-check/DjGoo-Host-update.json -Algorithm SHA256).Hash -ne
            (Get-FileHash build/DjGoo-Host-update.json -Algorithm SHA256).Hash
          ) {
            throw "The published alpha.19 updater manifest does not match the verified build."
          }
          Write-Host "Launcher-deferred alpha.19 updater published, downloaded, and verified."
