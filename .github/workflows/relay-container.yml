name: Relay Container

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "relay/**"
      - "voice/relay_*.py"
      - "voice/command_acceptance.py"
      - "tests/test_relay_*.py"
      - "requirements-relay.txt"
      - "requirements-dev.txt"
      - ".github/workflows/relay-container.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-relay.txt

      - name: Install relay test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-relay.txt

      - name: Compile relay sources
        run: python -m compileall -q relay voice tests

      - name: Run relay protocol tests
        run: |
          python -m pytest -q \
            tests/test_relay_crypto.py \
            tests/test_relay_server.py \
            tests/test_relay_end_to_end.py \
            tests/test_pairing_store.py \
            tests/test_voice_remote_security.py

      - name: Build unprivileged relay image
        run: docker build --file relay/Dockerfile --tag djgoo-relay:test .

      - name: Verify container user and health
        run: |
          test "$(docker image inspect djgoo-relay:test --format '{{.Config.User}}')" = "10001:10001"
          docker run --detach --rm --name djgoo-relay-test \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env DJGOO_RELAY_ALLOW_INSECURE=1 \
            --publish 18080:8080 \
            djgoo-relay:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/healthz
          docker stop djgoo-relay-test

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/djgoo-relay
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and publish relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
