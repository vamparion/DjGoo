name: Temporary Alpha3 Status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-alpha3-status.yml

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report current release runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --limit 20 --json databaseId,workflowName,status,conclusion,headBranch,headSha,createdAt,url)"
          body="$(jq -n --argjson runs "$runs" --arg sha "069258dfd7f5aca8486d3e74a854a4898699279f" '{merge_sha:$sha,runs:$runs}')"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Alpha3 release verification 069258df" --body "\`\`\`json
          $body
          \`\`\`"
