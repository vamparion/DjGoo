name: Temporary portable Lavalink readiness patch

# Second commit triggers this workflow after GitHub registers it on main.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-portable-lavalink-readiness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-known-good-managed-lavalink
          token: ${{ github.token }}
          fetch-depth: 0
      - run: python tools/patch_portable_lavalink_readiness.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/djgoo_portable_stack.py
          git commit -m "require Lavalink listener before Redbot readiness"
          git push origin HEAD:agent/restore-known-good-managed-lavalink
