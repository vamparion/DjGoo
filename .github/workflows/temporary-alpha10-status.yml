name: Temporary alpha.10 status

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report alpha.10 state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=release%2Fv0.3.0-alpha.10&per_page=50")"
          publisher="$(jq -r '[.workflow_runs[] | select(.name == "Publish Alpha Release")] | sort_by(.created_at) | reverse | .[0] | if . == null then ["not found","not-found","","not found"] else [.id,.status,(.conclusion // ""),.html_url] end | @tsv' <<<"$runs")"
          package="$(jq -r '[.workflow_runs[] | select(.name == "Portable Releases")] | sort_by(.created_at) | reverse | .[0] | if . == null then ["not found","not-found","","not found"] else [.id,.status,(.conclusion // ""),.html_url] end | @tsv' <<<"$runs")"
          IFS=$'\t' read -r publisher_id publisher_status publisher_conclusion publisher_url <<<"$publisher"
          IFS=$'\t' read -r package_id package_status package_conclusion package_url <<<"$package"

          release_status="missing"
          release_url="not found"
          target="not found"
          assets="none"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.3.0-alpha.10" >/tmp/release.json 2>/dev/null; then
            release_status="present"
            release_url="$(jq -r '.html_url' /tmp/release.json)"
            target="$(jq -r '.target_commitish' /tmp/release.json)"
            assets="$(jq -r '.assets[] | "- \(.name) — \(.size) bytes"' /tmp/release.json)"
          fi

          cat >/tmp/body.md <<EOF
          Temporary verification for v0.3.0-alpha.10.

          Publisher run ID: ${publisher_id}
          Publisher status: ${publisher_status}
          Publisher conclusion: ${publisher_conclusion:-pending}
          Publisher URL: ${publisher_url}

          Package run ID: ${package_id}
          Package status: ${package_status}
          Package conclusion: ${package_conclusion:-pending}
          Package URL: ${package_url}

          Release status: ${release_status}
          Release target: ${target}
          Release URL: ${release_url}

          Assets:
          ${assets}
          EOF

          gh issue create --title "Temporary alpha.10 release status" --body-file /tmp/body.md
