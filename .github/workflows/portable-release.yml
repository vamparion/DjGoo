name: Portable Releases

on:
  workflow_run:
    workflows:
      - Fast Application Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: Version; blank uses VERSION
        required: false
        type: string
      publish:
        description: Publish full packages into the existing prerelease
        required: true
        default: true
        type: boolean

concurrency:
  group: portable-release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11.9"
  PYTHON_EMBED_MD5: "6d9aa08531d48fcc261ba667e2df17c4"

jobs:
  build:
    name: Build cached clean-install packages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      REQUESTED_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'true' }}
    steps:
      - name: Check out exact fast-release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve version and publication mode
        id: version
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $version = if ($env:REQUESTED_VERSION.Trim()) {
            $env:REQUESTED_VERSION.Trim().TrimStart("v")
          } else {
            (Get-Content VERSION -Raw).Trim().TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?$') {
            throw "Invalid DjGoo version: $version"
          }
          $publish = $env:REQUESTED_PUBLISH.ToLowerInvariant()
          "DJGOO_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publish=$publish" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-bot.txt
            requirements-voice-base.txt
            requirements-speech.txt
            requirements-webrtc.txt

      - name: Set up Java build tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install small build toolset
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python tools/public_release_audit.py
          python -m compileall -q launcher voice tools local_cogs relay tests

      - name: Prepare immutable cached Python and speech layers
        id: runtimes
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $cacheBase = if ($env:RUNNER_TOOL_CACHE) {
            Join-Path $env:RUNNER_TOOL_CACHE "DjGoo"
          } else {
            Join-Path $env:USERPROFILE ".cache\DjGoo"
          }
          New-Item -ItemType Directory -Force build, $cacheBase | Out-Null
          python tools/prepare_runtime_layers.py `
            --cache-root $cacheBase `
            --python-version $env:PYTHON_VERSION `
            --python-embed-md5 $env:PYTHON_EMBED_MD5 `
            --output-json build/runtime-layers.json
          $runtime = Get-Content build/runtime-layers.json -Raw | ConvertFrom-Json
          "DJGOO_CACHE_ROOT=$cacheBase" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BOT_PYTHON_LAYER=$($runtime.bot_python)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VOICE_PYTHON_LAYER=$($runtime.voice_python)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SPEECH_LAYER=$($runtime.speech)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WEBRTC_LAYER=$($runtime.webrtc)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "### Runtime cache" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Bot Python: $($runtime.bot_key)" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Voice Python: $($runtime.voice_key)" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Shared speech: $($runtime.speech_key)" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Host WebRTC: $($runtime.webrtc_key)" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Resolve and cache pinned Audio Engine
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $botPython = Join-Path $env:BOT_PYTHON_LAYER "python.exe"
          $pin = (& $botPython -c "from redbot.cogs.audio.managed_node.version_pins import JAR_VERSION; print(str(JAR_VERSION))").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $pin) { throw "Could not resolve Audio Engine pin" }
          $jarCache = Join-Path $env:DJGOO_CACHE_ROOT "lavalink\$pin"
          $jar = Join-Path $jarCache "Lavalink.jar"
          New-Item -ItemType Directory -Force $jarCache | Out-Null
          if (!(Test-Path $jar) -or (Get-Item $jar).Length -lt 1000000) {
            $temporary = "$jar.tmp"
            Invoke-WebRequest -UseBasicParsing `
              "https://github.com/Cog-Creators/Lavalink-Jars/releases/download/$pin/Lavalink.jar" `
              -OutFile $temporary
            Move-Item $temporary $jar -Force
          }
          $output = (& "$env:JAVA_HOME/bin/java.exe" -jar $jar --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $output -notmatch "(?m)^Version:\s+$([regex]::Escape($pin))\s*$") {
            throw "Audio Engine validation failed: $output"
          }
          Copy-Item $jar build/Lavalink.jar -Force
          "LAVALINK_PIN=$pin" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build cached minimal Java runtime
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python tools/build_minimal_jre.py `
            --java-home $env:JAVA_HOME `
            --lavalink-jar build/Lavalink.jar `
            --cache-root "$env:DJGOO_CACHE_ROOT\java" `
            --output-json build/java-layer.json
          $java = Get-Content build/java-layer.json -Raw | ConvertFrom-Json
          "MINIMAL_JRE=$($java.path)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "- Minimal Java: $($java.cache_key) ($($java.modules.Count) modules)" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Build app layers and extraction-free launchers
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item build/full-release -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force build/full-release | Out-Null
          python tools/build_app_layer.py `
            --product host `
            --version $env:DJGOO_VERSION `
            --output build/full-release/host-app
          python tools/build_app_layer.py `
            --product voice `
            --version $env:DJGOO_VERSION `
            --output build/full-release/voice-app
          python tools/build_thin_launchers.py --output build/full-release/launchers

      - name: Assemble layered Host and Voice packages
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python tools/build_layered_package.py `
            --product host `
            --version $env:DJGOO_VERSION `
            --app-layer build/full-release/host-app `
            --launchers build/full-release/launchers `
            --runtime-python $env:BOT_PYTHON_LAYER `
            --webrtc-layer $env:WEBRTC_LAYER `
            --runtime-java $env:MINIMAL_JRE `
            --lavalink-jar build/Lavalink.jar `
            --output build/DjGoo-Host-win-x64
          python tools/build_layered_package.py `
            --product voice `
            --version $env:DJGOO_VERSION `
            --app-layer build/full-release/voice-app `
            --launchers build/full-release/launchers `
            --runtime-python $env:VOICE_PYTHON_LAYER `
            --speech-layer $env:SPEECH_LAYER `
            --output build/DjGoo-Voice-win-x64

          python tools/generate_sbom.py `
            --site-packages "$env:BOT_PYTHON_LAYER\Lib\site-packages" `
            --output build/DjGoo-Host-win-x64/sbom-runtime.cdx.json `
            --version $env:DJGOO_VERSION `
            --name "DjGoo Host Runtime"
          python tools/generate_sbom.py `
            --site-packages "$env:VOICE_PYTHON_LAYER\Lib\site-packages" `
            --output build/DjGoo-Voice-win-x64/sbom-runtime.cdx.json `
            --version $env:DJGOO_VERSION `
            --name "DjGoo Voice Runtime"
          python tools/generate_sbom.py `
            --site-packages "$env:SPEECH_LAYER\Lib\site-packages" `
            --output build/DjGoo-Voice-win-x64/sbom-speech.cdx.json `
            --version $env:DJGOO_VERSION `
            --name "DjGoo Speech Runtime"
          python -c "from pathlib import Path; from tools.build_layered_package import _write_manifest; _write_manifest(Path('build/DjGoo-Host-win-x64'), '$env:DJGOO_VERSION', 'host'); _write_manifest(Path('build/DjGoo-Voice-win-x64'), '$env:DJGOO_VERSION', 'voice')"

      - name: Build optional Host speech asset
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python tools/build_speech_runtime.py `
            --layer $env:SPEECH_LAYER `
            --output-zip build/DjGoo-SpeechRuntime-win-x64.zip `
            --output-manifest build/DjGoo-SpeechRuntime.json `
            --version $env:DJGOO_VERSION

      - name: Smoke-test layered packages
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $hostRoot = (Resolve-Path build/DjGoo-Host-win-x64).Path
          $hostApp = Join-Path $hostRoot "app\$env:DJGOO_VERSION"
          $env:DJGOO_HOME = $hostRoot
          $env:DJGOO_APP_ROOT = $hostApp
          $env:PYTHONPATH = $hostApp
          & "$hostRoot/runtime/python-bot/python.exe" `
            "$hostApp/tools/portable_red_setup.py" `
            --project-root $hostRoot `
            --non-interactive
          if ($LASTEXITCODE -ne 0) { throw "Layered Host setup smoke test failed" }
          & "$hostRoot/runtime/python-bot/python.exe" `
            "$hostApp/tools/layered_redbot_selector.py" `
            --djgoo-check
          if ($LASTEXITCODE -ne 0) { throw "Layered Host Music Core smoke test failed" }
          & "$hostRoot/runtime/python-bot/python.exe" -c "from tools.app_layout import active_app_root; import aiortc,av,pylibsrtp; from voice.webrtc_transport import WebRtcSignalManager; import launcher.djgoo_layered_host, tools.layered_stack, voice.connection_manager; from pathlib import Path; assert active_app_root(Path(r'$hostRoot')).name == '$env:DJGOO_VERSION'; assert WebRtcSignalManager; print('Layered Host WebRTC imports OK')"
          if ($LASTEXITCODE -ne 0) { throw "Layered Host import smoke test failed" }
          $javaOutput = (& "$hostRoot/runtime/java/bin/java.exe" -jar "$hostRoot/data/discordbot/cogs/Audio/Lavalink.jar" --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $javaOutput -notmatch "Version:") { throw "Minimal Host Java runtime failed: $javaOutput" }
          if ((Get-Item "$hostRoot/DjGoo.exe").Length -gt 524288) { throw "DjGoo thin launcher is unexpectedly large" }

          $voice = (Resolve-Path build/DjGoo-Voice-win-x64).Path
          $voiceApp = Join-Path $voice "app\$env:DJGOO_VERSION"
          $speech = Join-Path $voice "runtime\speech\Lib\site-packages"
          $env:DJGOO_HOME = $voice
          $env:DJGOO_APP_ROOT = $voiceApp
          $env:PYTHONPATH = "$voiceApp;$speech"
          & "$voice/runtime/python-voice/python.exe" -c "import launcher.djgoo_layered_voice, voice.djgoo_voice_remote_bound, faster_whisper, sounddevice; print('Layered Voice and speech imports OK')"
          if ($LASTEXITCODE -ne 0) { throw "Layered Voice import smoke test failed" }
          if ((Get-Item "$voice/DjGoo Voice.exe").Length -gt 524288) { throw "DjGoo Voice thin launcher is unexpectedly large" }

      - name: Create efficient standard ZIP archives
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python tools/fast_zip.py `
            --source build/DjGoo-Host-win-x64 `
            --output build/DjGoo-Host-win-x64.zip
          python tools/fast_zip.py `
            --source build/DjGoo-Voice-win-x64 `
            --output build/DjGoo-Voice-win-x64.zip

      - name: Retrieve already-published fast updater assets
        if: steps.version.outputs.publish == 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.version.outputs.tag }}"
          $ready = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            $json = gh release view $tag -R $env:GITHUB_REPOSITORY --json assets 2>$null
            if ($LASTEXITCODE -eq 0) {
              $release = $json | ConvertFrom-Json
              $names = @($release.assets | ForEach-Object { [string]$_.name })
              if (
                $names -contains "DjGoo-Host-update.zip" -and
                $names -contains "DjGoo-Host-update.json" -and
                $names -contains "DjGoo-Voice-update.zip" -and
                $names -contains "DjGoo-Voice-update.json"
              ) { $ready = $true; break }
            }
            Start-Sleep -Seconds 5
          }
          if (-not $ready) { throw "Fast updater assets were not published before the full package build." }
          gh release download $tag -R $env:GITHUB_REPOSITORY `
            --pattern "DjGoo-Host-update.zip" `
            --pattern "DjGoo-Host-update.json" `
            --pattern "DjGoo-Voice-update.zip" `
            --pattern "DjGoo-Voice-update.json" `
            --dir build `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not retrieve fast updater assets" }

      - name: Build unified release checksum inventory
        if: steps.version.outputs.publish == 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $assets = @(
            "DjGoo-Host-win-x64.zip",
            "DjGoo-Voice-win-x64.zip",
            "DjGoo-Host-update.zip",
            "DjGoo-Host-update.json",
            "DjGoo-Voice-update.zip",
            "DjGoo-Voice-update.json",
            "DjGoo-SpeechRuntime-win-x64.zip",
            "DjGoo-SpeechRuntime.json"
          )
          $lines = foreach ($asset in $assets) {
            $path = "build/$asset"
            if (!(Test-Path $path) -or (Get-Item $path).Length -le 0) {
              throw "Release asset is missing or empty: $asset"
            }
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          $lines | Set-Content -Encoding ASCII build/SHA256SUMS.txt

      - name: Complete the existing GitHub prerelease
        if: steps.version.outputs.publish == 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.version.outputs.tag }}"
          gh release upload $tag `
            build/DjGoo-Host-win-x64.zip `
            build/DjGoo-Voice-win-x64.zip `
            build/DjGoo-SpeechRuntime-win-x64.zip `
            build/DjGoo-SpeechRuntime.json `
            build/SHA256SUMS.txt `
            -R $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "GitHub rejected full package assets" }
          gh release delete-asset $tag SHA256SUMS-updates.txt `
            -R $env:GITHUB_REPOSITORY `
            --yes 2>$null
          gh release edit $tag `
            -R $env:GITHUB_REPOSITORY `
            --title "DjGoo $env:DJGOO_VERSION" `
            --prerelease

      - name: Download and verify all final release assets
        if: steps.version.outputs.publish == 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.version.outputs.tag }}"
          $required = @(
            "DjGoo-Host-win-x64.zip",
            "DjGoo-Voice-win-x64.zip",
            "DjGoo-Host-update.zip",
            "DjGoo-Host-update.json",
            "DjGoo-Voice-update.zip",
            "DjGoo-Voice-update.json",
            "DjGoo-SpeechRuntime-win-x64.zip",
            "DjGoo-SpeechRuntime.json",
            "SHA256SUMS.txt"
          )
          $release = gh release view $tag -R $env:GITHUB_REPOSITORY --json assets,isPrerelease,tagName | ConvertFrom-Json
          $sizes = @{}
          foreach ($asset in $release.assets) { $sizes[[string]$asset.name] = [int64]$asset.size }
          $missing = @($required | Where-Object { !$sizes.ContainsKey($_) -or $sizes[$_] -le 0 })
          if ($missing.Count -gt 0) { throw "Final release is incomplete: $($missing -join ', ')" }
          if (-not [bool]$release.isPrerelease -or [string]$release.tagName -ne $tag) {
            throw "Final release metadata is invalid"
          }

          Remove-Item published-final -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force published-final | Out-Null
          foreach ($name in $required) {
            gh release download $tag -R $env:GITHUB_REPOSITORY `
              --pattern $name `
              --dir published-final `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw "Published asset is not downloadable: $name" }
          }
          foreach ($name in $required) {
            $built = "build/$name"
            if (Test-Path $built) {
              $builtHash = (Get-FileHash $built -Algorithm SHA256).Hash
              $publishedHash = (Get-FileHash "published-final/$name" -Algorithm SHA256).Hash
              if ($builtHash -ne $publishedHash) { throw "Published asset differs from verified build: $name" }
            }
          }
          "## Complete layered release $tag" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          foreach ($name in $required) {
            "- $name : $($sizes[$name]) bytes" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          Write-Host "Complete updater-visible and clean-install release verified: $tag"
