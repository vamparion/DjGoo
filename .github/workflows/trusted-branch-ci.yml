name: Trusted branch CI

on:
  push:
    branches:
      - "agent/**"
      - "release/**"
  workflow_dispatch:

concurrency:
  group: trusted-branch-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  test:
    # Only branches pushed inside vamparion/DjGoo can trigger this workflow.
    # Forked pull requests cannot execute code on the AEGIS release machine.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-voice.txt

      - name: Install test dependencies
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed with exit $LASTEXITCODE" }
          python -m pip install --requirement requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Test dependency installation failed with exit $LASTEXITCODE" }

      - name: Audit public-release safety
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python tools/public_release_audit.py
          if ($LASTEXITCODE -ne 0) { throw "Public release audit failed with exit $LASTEXITCODE" }

      - name: Compile Python sources
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"
          python -m compileall -q launcher voice tools local_cogs relay tests 2>&1 | Tee-Object -FilePath compile.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Source compilation failed with exit $exitCode" }

      - name: Run complete test suite
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"
          python -m pytest -q 2>&1 | Tee-Object -FilePath pytest.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Test suite failed with exit $exitCode" }

      - name: Smoke-test Windows thin launchers and fast updater packaging
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim().TrimStart("v")
          Remove-Item build/trusted-layered -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force build/trusted-layered | Out-Null

          python tools/build_app_layer.py `
            --product host `
            --version $version `
            --output build/trusted-layered/host-app
          if ($LASTEXITCODE -ne 0) { throw "Host application layer build failed" }
          python tools/build_app_layer.py `
            --product voice `
            --version $version `
            --output build/trusted-layered/voice-app
          if ($LASTEXITCODE -ne 0) { throw "Voice application layer build failed" }
          python tools/build_thin_launchers.py `
            --output build/trusted-layered/launchers
          if ($LASTEXITCODE -ne 0) { throw "Thin launcher build failed" }

          python tools/build_layered_update_root.py `
            --product host `
            --version $version `
            --app-layer build/trusted-layered/host-app `
            --launchers build/trusted-layered/launchers `
            --output build/trusted-layered/host-root
          if ($LASTEXITCODE -ne 0) { throw "Host update root build failed" }
          python tools/build_layered_update_root.py `
            --product voice `
            --version $version `
            --app-layer build/trusted-layered/voice-app `
            --launchers build/trusted-layered/launchers `
            --output build/trusted-layered/voice-root
          if ($LASTEXITCODE -ne 0) { throw "Voice update root build failed" }

          python tools/build_update_bundle.py `
            --package-root build/trusted-layered/host-root `
            --output-zip build/trusted-layered/DjGoo-Host-update.zip `
            --output-manifest build/trusted-layered/DjGoo-Host-update.json `
            --version $version
          if ($LASTEXITCODE -ne 0) { throw "Layered Host updater build failed" }
          python tools/build_voice_update_bundle.py `
            --package-root build/trusted-layered/voice-root `
            --output-zip build/trusted-layered/DjGoo-Voice-update.zip `
            --output-manifest build/trusted-layered/DjGoo-Voice-update.json `
            --version $version
          if ($LASTEXITCODE -ne 0) { throw "Layered Voice updater build failed" }

          python -c "import json,zipfile; from pathlib import Path; root=Path('build/trusted-layered'); h=json.loads((root/'DjGoo-Host-update.json').read_text()); v=json.loads((root/'DjGoo-Voice-update.json').read_text()); assert h['package_layout']=='versioned-app-v1'; assert v['package_layout']=='versioned-app-v1'; assert h['runtime_generation']==4 and v['runtime_generation']==4; assert not any(x['path'].startswith('runtime/') for x in h['files']+v['files']); assert (root/'launchers/DjGoo.exe').stat().st_size < 524288; assert (root/'launchers/DjGoo Voice.exe').stat().st_size < 524288; zipfile.ZipFile(root/'DjGoo-Host-update.zip').testzip() is None; zipfile.ZipFile(root/'DjGoo-Voice-update.zip').testzip() is None; print('Windows layered fast-release smoke test passed')"
          if ($LASTEXITCODE -ne 0) { throw "Layered updater contract smoke test failed" }

      - name: Publish trusted CI commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $state = if ($env:JOB_STATUS -eq "success") { "success" } else { "failure" }
          $description = if ($state -eq "success") {
            "Audit, tests, launchers, and fast updater packaging passed"
          } else {
            "Trusted branch validation failed on AEGIS"
          }
          $target = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -f state=$state `
            -f context="DjGoo/trusted-branch-ci" `
            -f description=$description `
            -f target_url=$target
          if ($LASTEXITCODE -ne 0) { throw "Could not publish trusted CI commit status" }
