name: Trusted branch CI

on:
  push:
    branches:
      - "agent/**"
      - "release/**"
      - "codex/browser-webrtc-remote-control-pr"
  workflow_dispatch:

concurrency:
  group: trusted-branch-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

env:
  PYTHON_VERSION: "3.11.9"
  PYTHON_EMBED_MD5: "6d9aa08531d48fcc261ba667e2df17c4"

jobs:
  test:
    # Only branches pushed inside vamparion/DjGoo can trigger this workflow.
    # Forked pull requests cannot execute code on the AEGIS release machine.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-voice.txt
            requirements-webrtc.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control_panel_ui/package-lock.json

      - name: Install test dependencies
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed with exit $LASTEXITCODE" }
          python -m pip install --requirement requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Test dependency installation failed with exit $LASTEXITCODE" }
          python -m pip install --requirement requirements-webrtc.txt
          if ($LASTEXITCODE -ne 0) { throw "WebRTC test dependency installation failed with exit $LASTEXITCODE" }

      - name: Run browser transport tests
        working-directory: control_panel_ui
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          npm ci
          npm test
          npm run build

      - name: Audit public-release safety
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python tools/public_release_audit.py
          if ($LASTEXITCODE -ne 0) { throw "Public release audit failed with exit $LASTEXITCODE" }

      - name: Compile Python sources
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"
          python -m compileall -q launcher voice tools local_cogs relay tests 2>&1 | Tee-Object -FilePath compile.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Source compilation failed with exit $exitCode" }

      - name: Run complete test suite
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"
          python -m pytest -q 2>&1 | Tee-Object -FilePath pytest.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Test suite failed with exit $exitCode" }

      - name: Smoke-test Windows thin launchers and fast updater packaging
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim().TrimStart("v")
          Remove-Item build/trusted-layered -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force build/trusted-layered | Out-Null

          python tools/build_app_layer.py `
            --product host `
            --version $version `
            --output build/trusted-layered/host-app
          if ($LASTEXITCODE -ne 0) { throw "Host application layer build failed" }
          python tools/build_app_layer.py `
            --product voice `
            --version $version `
            --output build/trusted-layered/voice-app
          if ($LASTEXITCODE -ne 0) { throw "Voice application layer build failed" }
          python tools/build_thin_launchers.py `
            --output build/trusted-layered/launchers
          if ($LASTEXITCODE -ne 0) { throw "Thin launcher build failed" }
          python tools/build_webrtc_runtime.py --output build/trusted-layered/webrtc-layer
          if ($LASTEXITCODE -ne 0) { throw "Host WebRTC layer build failed" }

          python tools/build_layered_update_root.py `
            --product host `
            --version $version `
            --app-layer build/trusted-layered/host-app `
            --launchers build/trusted-layered/launchers `
            --webrtc-layer build/trusted-layered/webrtc-layer `
            --output build/trusted-layered/host-root
          if ($LASTEXITCODE -ne 0) { throw "Host update root build failed" }
          python tools/build_layered_update_root.py `
            --product voice `
            --version $version `
            --app-layer build/trusted-layered/voice-app `
            --launchers build/trusted-layered/launchers `
            --output build/trusted-layered/voice-root
          if ($LASTEXITCODE -ne 0) { throw "Voice update root build failed" }

          python tools/build_update_bundle.py `
            --package-root build/trusted-layered/host-root `
            --output-zip build/trusted-layered/DjGoo-Host-update.zip `
            --output-manifest build/trusted-layered/DjGoo-Host-update.json `
            --version $version
          if ($LASTEXITCODE -ne 0) { throw "Layered Host updater build failed" }
          python tools/build_voice_update_bundle.py `
            --package-root build/trusted-layered/voice-root `
            --output-zip build/trusted-layered/DjGoo-Voice-update.zip `
            --output-manifest build/trusted-layered/DjGoo-Voice-update.json `
            --version $version
          if ($LASTEXITCODE -ne 0) { throw "Layered Voice updater build failed" }

          python -c "import json,zipfile; from pathlib import Path; root=Path('build/trusted-layered'); h=json.loads((root/'DjGoo-Host-update.json').read_text()); v=json.loads((root/'DjGoo-Voice-update.json').read_text()); assert h['package_layout']=='versioned-app-v1'; assert v['package_layout']=='versioned-app-v1'; assert h['runtime_generation']==4 and v['runtime_generation']==4; assert any(x['path'].startswith('runtime/webrtc/') for x in h['files']); assert not any(x['path'].startswith('runtime/') for x in v['files']); assert (root/'launchers/DjGoo.exe').stat().st_size < 524288; assert (root/'launchers/DjGoo Voice.exe').stat().st_size < 524288; assert zipfile.ZipFile(root/'DjGoo-Host-update.zip').testzip() is None; assert zipfile.ZipFile(root/'DjGoo-Voice-update.zip').testzip() is None; print('Windows layered fast-release smoke test passed')"
          if ($LASTEXITCODE -ne 0) { throw "Layered updater contract smoke test failed" }

      - name: Smoke-test alpha.25 runtime upgrading to alpha.26 WebRTC
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim().TrimStart("v")
          if ($version -ne "0.3.0-alpha.26") {
            Write-Host "Alpha.25 to alpha.26 migration smoke is not applicable to $version."
            exit 0
          }
          $cacheBase = if ($env:RUNNER_TOOL_CACHE) { Join-Path $env:RUNNER_TOOL_CACHE "DjGoo" } else { Join-Path $env:USERPROFILE ".cache\DjGoo" }
          python tools/prepare_runtime_layers.py `
            --cache-root $cacheBase `
            --python-version $env:PYTHON_VERSION `
            --python-embed-md5 $env:PYTHON_EMBED_MD5 `
            --output-json build/trusted-layered/runtime-layers.json
          $runtime = Get-Content build/trusted-layered/runtime-layers.json -Raw | ConvertFrom-Json
          python tools/smoke_alpha25_webrtc_upgrade.py `
            --runtime-layer $runtime.bot_python `
            --bundle build/trusted-layered/DjGoo-Host-update.zip `
            --manifest build/trusted-layered/DjGoo-Host-update.json `
            --output build/trusted-layered/alpha25-upgraded
          if ($LASTEXITCODE -ne 0) { throw "Alpha.25 to alpha.26 WebRTC migration smoke test failed" }

      - name: Publish trusted CI commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if ($env:JOB_STATUS -eq "cancelled") {
            Write-Host "Superseded trusted CI run was cancelled; leaving commit status to the newer run."
            exit 0
          }
          $state = if ($env:JOB_STATUS -eq "success") { "success" } else { "failure" }
          $description = if ($state -eq "success") {
            "Audit, tests, launchers, and fast updater packaging passed"
          } else {
            "Trusted branch validation failed on AEGIS"
          }
          $target = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -f state=$state `
            -f context="DjGoo/trusted-branch-ci" `
            -f description=$description `
            -f target_url=$target
          if ($LASTEXITCODE -ne 0) { throw "Could not publish trusted CI commit status" }
