# Release publication receipt contract: 3
name: Verify Published Release

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "launcher/**"
      - "voice/**"
      - "local_cogs/djgoowelcome/**"
      - "relay/**"
      - "tools/**"
      - "requirements-*.txt"
      - "pyproject.toml"
      - ".github/workflows/portable-release.yml"
      - ".github/workflows/verify-published-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-published-release
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify and record release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $required = @(
            "DjGoo-Host-update.json",
            "DjGoo-Host-update.zip",
            "DjGoo-Voice-update.json",
            "DjGoo-Voice-update.zip",
            "DjGoo-Host-win-x64.zip",
            "DjGoo-Voice-win-x64.zip",
            "SHA256SUMS.txt"
          )
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "DjGoo-Release-Verifier"
          }
          $statusDirectory = Join-Path ".github" "release-status"
          $receiptDirectory = Join-Path ".github" "release-receipts"
          New-Item -ItemType Directory -Force $statusDirectory | Out-Null
          New-Item -ItemType Directory -Force $receiptDirectory | Out-Null
          $statusPath = Join-Path $statusDirectory "$tag.json"
          $receiptPath = Join-Path $receiptDirectory "$tag.json"

          function Save-ReleaseState($release, [string[]]$missing, [bool]$complete) {
            $assets = @()
            if ($null -ne $release) {
              $assets = @(
                foreach ($asset in @($release.assets)) {
                  [ordered]@{
                    name = [string]$asset.name
                    size = [int64]$asset.size
                    digest = $asset.digest
                    state = [string]$asset.state
                  }
                }
              ) | Sort-Object { $_.name }
            }
            $payload = [ordered]@{
              schema = 1
              tag = $tag
              complete = $complete
              release_id = if ($null -ne $release) { $release.id } else { $null }
              target_commitish = if ($null -ne $release) { $release.target_commitish } else { $null }
              prerelease = if ($null -ne $release) { [bool]$release.prerelease } else { $null }
              published_at = if ($null -ne $release) { $release.published_at } else { $null }
              checked_at = [DateTimeOffset]::UtcNow.ToString("o")
              missing = @($missing)
              assets = @($assets)
            }
            $payload | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 $statusPath
            if ($complete) {
              $payload.verified_at = [DateTimeOffset]::UtcNow.ToString("o")
              $payload | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 $receiptPath
            }
          }

          function Push-ReleaseState([string]$message) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $statusPath
            if (Test-Path $receiptPath) { git add $receiptPath }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { return }
            git commit -m $message
            if ($LASTEXITCODE -ne 0) { throw "Release state commit failed with exit $LASTEXITCODE" }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Release state push failed with exit $LASTEXITCODE" }
          }

          $release = $null
          $missing = @($required)
          for ($attempt = 1; $attempt -le 180; $attempt++) {
            try {
              $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
              $candidate = Invoke-RestMethod -UseBasicParsing -Uri $uri -Headers $headers -Method Get
              $uploaded = @{}
              foreach ($asset in @($candidate.assets)) {
                if ([string]::IsNullOrWhiteSpace([string]$asset.name)) { continue }
                if ([int64]$asset.size -le 0) { continue }
                if ($asset.state -and [string]$asset.state -ne "uploaded") { continue }
                $uploaded[[string]$asset.name] = $true
              }
              $missing = @($required | Where-Object { -not $uploaded.ContainsKey($_) })
              $release = $candidate
            } catch {
              $release = $null
              $missing = @($required)
              Write-Host "Waiting for $tag: $($_.Exception.Message)"
            }

            $complete = $null -ne $release -and $missing.Count -eq 0
            Save-ReleaseState $release $missing $complete
            if ($attempt -eq 1 -or $complete -or $attempt % 6 -eq 0) {
              $message = if ($complete) {
                "Record verified $tag release assets"
              } else {
                "Record pending $tag release assets"
              }
              Push-ReleaseState $message
            }
            if ($complete) {
              Write-Host "All required release assets are uploaded and recorded."
              exit 0
            }
            Write-Host "Waiting for release assets: $($missing -join ', ')"
            Start-Sleep -Seconds 10
          }
          throw "$tag did not become complete within 30 minutes."
