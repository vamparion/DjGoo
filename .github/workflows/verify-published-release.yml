# Release publication verification contract: 11
name: Verify Published Release

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "launcher/**"
      - "voice/**"
      - "local_cogs/djgoowelcome/**"
      - "relay/**"
      - "tools/**"
      - "requirements-*.txt"
      - "pyproject.toml"
      - ".github/workflows/portable-release.yml"
      - ".github/workflows/verify-published-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: verify-published-release
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $title = "Release verification: $tag"
          $required = @(
            "DjGoo-Host-update.json",
            "DjGoo-Host-update.zip",
            "DjGoo-Voice-update.json",
            "DjGoo-Voice-update.zip",
            "DjGoo-Host-win-x64.zip",
            "DjGoo-Voice-win-x64.zip",
            "SHA256SUMS.txt"
          )
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "DjGoo-Release-Verifier"
          }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"

          function Request([string]$Method, [string]$Uri, $Payload = $null) {
            if ($null -eq $Payload) {
              return Invoke-RestMethod -UseBasicParsing -Method $Method -Uri $Uri -Headers $headers
            }
            return Invoke-RestMethod -UseBasicParsing -Method $Method -Uri $Uri -Headers $headers -ContentType "application/json" -Body ($Payload | ConvertTo-Json -Depth 10)
          }

          $issues = @(Request GET "$api/issues?state=all&per_page=100")
          $issue = $issues | Where-Object { [string]$_.title -eq $title -and $null -eq $_.pull_request } | Select-Object -First 1
          if ($null -eq $issue) {
            $issue = Request POST "$api/issues" @{ title = $title; body = "Automated verification is starting." }
          }
          $issueNumber = [int]$issue.number

          function Report([string]$Body, [bool]$Complete) {
            $payload = @{ body = $Body; state = if ($Complete) { "closed" } else { "open" } }
            if ($Complete) { $payload.state_reason = "completed" }
            Request PATCH "$api/issues/$issueNumber" $payload | Out-Null
          }

          Report "Automated verifier started for **$tag** at $([DateTimeOffset]::UtcNow.ToString('o'))." $false

          for ($attempt = 1; $attempt -le 180; $attempt++) {
            $release = $null
            $missing = @($required)
            $lines = @()
            try {
              $release = Request GET "$api/releases/tags/$tag"
              $uploaded = @{}
              foreach ($asset in @($release.assets)) {
                $name = [string]$asset.name
                $size = [int64]$asset.size
                $state = [string]$asset.state
                if ($name -and $size -gt 0 -and (!$state -or $state -eq "uploaded")) { $uploaded[$name] = $true }
                $lines += "- ``$name`` — $size bytes — $state"
              }
              $missing = @($required | Where-Object { -not $uploaded.ContainsKey($_) })
            } catch {
              Write-Host "Waiting for $tag: $($_.Exception.Message)"
            }

            if ($null -ne $release -and $missing.Count -eq 0) {
              $body = @"
          **Verified complete: $tag**

          Published: $($release.published_at)
          Verified: $([DateTimeOffset]::UtcNow.ToString("o"))
          Release ID: $($release.id)
          Target: $($release.target_commitish)

          All required assets are uploaded and non-empty:

          $($lines -join "`n")
          "@
              Report $body $true
              Write-Host "All required assets verified."
              exit 0
            }

            if ($attempt -eq 1 -or $attempt % 6 -eq 0) {
              $missingLines = @($missing | ForEach-Object { "- ``$_``" })
              $body = @"
          Automated verification is still running for **$tag**.

          Checked: $([DateTimeOffset]::UtcNow.ToString("o"))

          Missing or incomplete:
          $($missingLines -join "`n")

          GitHub currently reports:
          $($lines -join "`n")
          "@
              Report $body $false
            }
            Start-Sleep -Seconds 10
          }

          Report "Verification timed out after 30 minutes for **$tag**." $false
          throw "$tag did not become complete within 30 minutes."
