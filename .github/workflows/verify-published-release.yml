# Release publication receipt contract: 2
name: Verify Published Release

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "launcher/**"
      - "voice/**"
      - "local_cogs/djgoowelcome/**"
      - "relay/**"
      - "tools/**"
      - "requirements-*.txt"
      - "pyproject.toml"
      - ".github/workflows/portable-release.yml"
      - ".github/workflows/verify-published-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-published-release
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for complete updater-visible release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $required = @(
            "DjGoo-Host-update.json",
            "DjGoo-Host-update.zip",
            "DjGoo-Voice-update.json",
            "DjGoo-Voice-update.zip",
            "DjGoo-Host-win-x64.zip",
            "DjGoo-Voice-win-x64.zip",
            "SHA256SUMS.txt"
          )
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "DjGoo-Release-Verifier"
          }
          $release = $null
          for ($attempt = 1; $attempt -le 180; $attempt++) {
            try {
              $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
              $candidate = Invoke-RestMethod -UseBasicParsing -Uri $uri -Headers $headers -Method Get
              $uploaded = @{}
              foreach ($asset in @($candidate.assets)) {
                if ([string]::IsNullOrWhiteSpace([string]$asset.name)) { continue }
                if ([int64]$asset.size -le 0) { continue }
                if ($asset.state -and [string]$asset.state -ne "uploaded") { continue }
                $uploaded[[string]$asset.name] = $true
              }
              $missing = @($required | Where-Object { -not $uploaded.ContainsKey($_) })
              if ($missing.Count -eq 0) {
                $release = $candidate
                Write-Host "All required release assets are uploaded."
                break
              }
              Write-Host "Waiting for release assets: $($missing -join ', ')"
            } catch {
              Write-Host "Waiting for $tag to become available: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          if ($null -eq $release) {
            throw "$tag did not become complete within 30 minutes."
          }

          $receiptDirectory = Join-Path ".github" "release-receipts"
          New-Item -ItemType Directory -Force $receiptDirectory | Out-Null
          $assets = @(
            foreach ($asset in @($release.assets)) {
              [ordered]@{
                name = [string]$asset.name
                size = [int64]$asset.size
                digest = $asset.digest
                state = [string]$asset.state
              }
            }
          ) | Sort-Object { $_.name }
          $payload = [ordered]@{
            schema = 1
            tag = $tag
            release_id = $release.id
            target_commitish = $release.target_commitish
            prerelease = [bool]$release.prerelease
            published_at = $release.published_at
            verified_at = [DateTimeOffset]::UtcNow.ToString("o")
            assets = @($assets)
          }
          $receiptPath = Join-Path $receiptDirectory "$tag.json"
          $payload | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 $receiptPath
          Write-Host "Wrote $receiptPath"

      - name: Commit publication receipt
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v$((Get-Content VERSION -Raw).Trim())"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/release-receipts/$tag.json"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Publication receipt already matches."
            exit 0
          }
          git commit -m "Record verified $tag release assets"
          if ($LASTEXITCODE -ne 0) { throw "Receipt commit failed with exit $LASTEXITCODE" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Receipt push failed with exit $LASTEXITCODE" }
