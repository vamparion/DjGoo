# Release publication verification contract: 7
name: Verify Published Release

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "launcher/**"
      - "voice/**"
      - "local_cogs/djgoowelcome/**"
      - "relay/**"
      - "tools/**"
      - "requirements-*.txt"
      - "pyproject.toml"
      - ".github/workflows/portable-release.yml"
      - ".github/workflows/verify-published-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: verify-published-release
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Clear obsolete queued runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          gh run list -R "$GITHUB_REPOSITORY" --status queued --limit 100 \
            --json databaseId,name,event,headBranch \
            --jq '.[] | .databaseId' |
          while read -r run_id; do
            [[ -z "$run_id" || "$run_id" == "$GITHUB_RUN_ID" ]] && continue
            echo "Cancelling obsolete queued run $run_id"
            gh run cancel "$run_id" -R "$GITHUB_REPOSITORY" || true
          done

      - name: Verify release assets and report status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < VERSION)"
          tag="v${version}"
          title="Release verification: ${tag}"
          required=(
            DjGoo-Host-update.json
            DjGoo-Host-update.zip
            DjGoo-Voice-update.json
            DjGoo-Voice-update.zip
            DjGoo-Host-win-x64.zip
            DjGoo-Voice-win-x64.zip
            SHA256SUMS.txt
          )

          issue_number="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq ".[] | select(.pull_request == null and .title == \"${title}\") | .number" |
            head -n 1
          )"
          if [[ -z "$issue_number" ]]; then
            issue_number="$(
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" \
                -f title="$title" \
                -f body="Automated release verification has started." \
                --jq '.number'
            )"
          fi
          gh issue reopen "$issue_number" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true

          cat > verification.md <<EOF
          Automated verifier started for **${tag}**.

          Started: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Checking the GitHub release and all required updater/full-package assets now.
          EOF
          gh issue edit "$issue_number" -R "$GITHUB_REPOSITORY" --body-file verification.md

          for attempt in $(seq 1 180); do
            missing=("${required[@]}")
            asset_lines=""
            release_available=false
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > release.json 2>/dev/null; then
              release_available=true
              mapfile -t uploaded < <(
                jq -r '.assets[] | select((.size // 0) > 0 and ((.state // "uploaded") == "uploaded")) | .name' release.json
              )
              missing=()
              for required_name in "${required[@]}"; do
                found=false
                for uploaded_name in "${uploaded[@]}"; do
                  if [[ "$required_name" == "$uploaded_name" ]]; then
                    found=true
                    break
                  fi
                done
                [[ "$found" == true ]] || missing+=("$required_name")
              done
              asset_lines="$(
                jq -r '.assets[] | "- `\(.name)` — \(.size // 0) bytes — \(.state // "uploaded")"' release.json
              )"
            fi

            if [[ "$release_available" == true && ${#missing[@]} -eq 0 ]]; then
              published_at="$(jq -r '.published_at // "unknown"' release.json)"
              release_id="$(jq -r '.id // "unknown"' release.json)"
              target="$(jq -r '.target_commitish // "unknown"' release.json)"
              cat > verification.md <<EOF
          **Verified complete: ${tag}**

          Published: ${published_at}
          Verified: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Release ID: ${release_id}
          Target: ${target}

          All required assets are present, uploaded, and non-empty:

          ${asset_lines}
          EOF
              gh issue edit "$issue_number" -R "$GITHUB_REPOSITORY" --body-file verification.md
              gh issue close "$issue_number" -R "$GITHUB_REPOSITORY" --reason completed
              echo "All required release assets are uploaded and verified."
              exit 0
            fi

            if [[ "$attempt" -eq 1 || $((attempt % 6)) -eq 0 ]]; then
              missing_lines=""
              for item in "${missing[@]}"; do
                missing_lines+="- \`${item}\`"$'\n'
              done
              cat > verification.md <<EOF
          Automated verification is still running for **${tag}**.

          Last checked: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Missing or incomplete required assets:

          ${missing_lines}
          Assets currently reported by GitHub:

          ${asset_lines}
          EOF
              gh issue edit "$issue_number" -R "$GITHUB_REPOSITORY" --body-file verification.md
            fi
            sleep 10
          done

          gh issue edit "$issue_number" -R "$GITHUB_REPOSITORY" \
            --body "Verification timed out after 30 minutes for **${tag}**."
          exit 1
