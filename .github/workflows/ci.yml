name: DjGoo CI

on:
  pull_request:
  # Keep the main push event only to cancel any older queued main CI run through
  # the concurrency group below. The test job itself is PR-only because the
  # Portable Releases workflow runs the same full suite before publishing.
  push:
    branches:
      - main

concurrency:
  group: djgoo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.title, 'Cancel obsolete portable release')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-voice.txt

      - name: Install test dependencies
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed with exit $LASTEXITCODE" }
          python -m pip install --requirement requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Test dependency installation failed with exit $LASTEXITCODE" }

      - name: Compile Python sources
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"
          python -m compileall -q launcher voice tools local_cogs relay tests 2>&1 | Tee-Object -FilePath compile.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Source compilation failed with exit $exitCode" }

      - name: Run complete test suite
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"
          python -m pytest -q 2>&1 | Tee-Object -FilePath pytest.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Test suite failed with exit $exitCode" }
