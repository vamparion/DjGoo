name: Public pull request CI

on:
  pull_request:

concurrency:
  group: public-pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Public repositories receive GitHub-hosted Actions capacity. While this
    # repository remains private, trusted branch CI performs the same checks on
    # AEGIS without exposing that machine to forked pull-request code.
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-voice.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control_panel_ui/package-lock.json

      - name: Build web control surface
        working-directory: control_panel_ui
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit $LASTEXITCODE" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Web build failed with exit $LASTEXITCODE" }

      - name: Install test dependencies
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed with exit $LASTEXITCODE" }
          python -m pip install --requirement requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Test dependency installation failed with exit $LASTEXITCODE" }

      - name: Audit public-release safety
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python tools/public_release_audit.py
          if ($LASTEXITCODE -ne 0) { throw "Public release audit failed with exit $LASTEXITCODE" }

      - name: Compile Python sources
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"
          python -m compileall -q launcher voice tools local_cogs relay tests 2>&1 | Tee-Object -FilePath compile.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Source compilation failed with exit $exitCode" }

      - name: Run complete test suite
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"
          python -m pytest -q 2>&1 | Tee-Object -FilePath pytest.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Test suite failed with exit $exitCode" }
