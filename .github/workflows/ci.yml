name: DjGoo CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-voice.txt

      - name: Install PortAudio runtime
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q voice tools local_cogs tests

      - name: Run reliability tests
        run: |
          python -m pytest -q \
            tests/test_media_policy.py \
            tests/test_sqlite_stations.py \
            tests/test_extended_voice_commands.py \
            tests/test_voice_audio_processing.py \
            tests/test_stack_supervisor.py
