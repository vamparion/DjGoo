name: DjGoo CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-voice.txt

      - name: Install PortAudio runtime
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt

      - name: Compile Python sources
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q launcher voice tools local_cogs relay tests 2>&1 | tee compile.log

      - name: Run complete test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: djgoo-ci-diagnostics
          path: |
            compile.log
            pytest.log
          if-no-files-found: warn
          retention-days: 7
