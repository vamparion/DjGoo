name: DjGoo CI

on:
  pull_request:

concurrency:
  group: djgoo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: false
    runs-on: [self-hosted, Windows, X64]
    steps:
      - run: echo "PR 61 is superseded by PR 62; no runner allocation required."
