name: Temporary Release Status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-release-status.yml

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report current release runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --limit 30 --json databaseId,workflowName,status,conclusion,headBranch,headSha,createdAt,url)"
          body="$(jq -n --argjson runs "$runs" --arg sha "fd3dc594b52342589b6e6bb3b89f19b3c7503321" '{merge_sha:$sha,runs:$runs}')"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Alpha release verification fd3dc594" --body "\`\`\`json
          $body
          \`\`\`"
