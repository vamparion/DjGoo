name: Repair and verify release assets

on:
  workflow_run:
    workflows:
      - Portable Releases
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: Version to repair; blank uses VERSION
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: repair-release-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair and verify updater-visible release
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $requested = "${{ inputs.version }}".Trim()
          $version = if ($requested) {
            $requested.TrimStart("v")
          } else {
            (Get-Content VERSION -Raw).Trim().TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?$') {
            throw "Invalid DjGoo version: $version"
          }
          $tag = "v$version"

          $releaseReady = $false
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            $releaseJson = gh release view $tag -R $env:GITHUB_REPOSITORY --json assets 2>$null
            if ($LASTEXITCODE -eq 0) {
              $release = $releaseJson | ConvertFrom-Json
              $names = @($release.assets | ForEach-Object { [string]$_.name })
              if (
                $names -contains "DjGoo-Host-win-x64.zip" -and
                $names -contains "DjGoo-Voice-win-x64.zip"
              ) {
                $releaseReady = $true
                break
              }
            }
            Start-Sleep -Seconds 10
          }
          if (-not $releaseReady) {
            throw "The full portable packages for $tag never became available."
          }

          Remove-Item repair, build -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force repair, repair/host, repair/voice, build | Out-Null

          gh release download $tag -R $env:GITHUB_REPOSITORY `
            --pattern "DjGoo-Host-win-x64.zip" `
            --pattern "DjGoo-Voice-win-x64.zip" `
            --dir repair `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the published portable packages."
          }
          foreach ($path in @(
            "repair/DjGoo-Host-win-x64.zip",
            "repair/DjGoo-Voice-win-x64.zip"
          )) {
            if (!(Test-Path $path) -or (Get-Item $path).Length -le 0) {
              throw "Published package is missing or empty: $path"
            }
          }

          Expand-Archive repair/DjGoo-Host-win-x64.zip repair/host -Force
          Expand-Archive repair/DjGoo-Voice-win-x64.zip repair/voice -Force
          $hostExe = Get-ChildItem repair/host -Recurse -File -Filter "DjGoo.exe" | Select-Object -First 1
          $voiceExe = Get-ChildItem repair/voice -Recurse -File -Filter "DjGoo Voice.exe" | Select-Object -First 1
          if (-not $hostExe) { throw "Published Host package does not contain DjGoo.exe." }
          if (-not $voiceExe) { throw "Published Voice package does not contain DjGoo Voice.exe." }

          python tools/build_update_bundle.py `
            --package-root $hostExe.Directory.FullName `
            --output-zip build/DjGoo-Host-update.zip `
            --output-manifest build/DjGoo-Host-update.json `
            --version $version
          if ($LASTEXITCODE -ne 0) { throw "Host updater rebuild failed." }

          python tools/build_voice_update_bundle.py `
            --package-root $voiceExe.Directory.FullName `
            --output-zip build/DjGoo-Voice-update.zip `
            --output-manifest build/DjGoo-Voice-update.json `
            --version $version
          if ($LASTEXITCODE -ne 0) { throw "Voice updater rebuild failed." }

          $releaseFiles = [ordered]@{
            "DjGoo-Host-win-x64.zip" = "repair/DjGoo-Host-win-x64.zip"
            "DjGoo-Voice-win-x64.zip" = "repair/DjGoo-Voice-win-x64.zip"
            "DjGoo-Host-update.zip" = "build/DjGoo-Host-update.zip"
            "DjGoo-Host-update.json" = "build/DjGoo-Host-update.json"
            "DjGoo-Voice-update.zip" = "build/DjGoo-Voice-update.zip"
            "DjGoo-Voice-update.json" = "build/DjGoo-Voice-update.json"
          }
          $checksumLines = foreach ($entry in $releaseFiles.GetEnumerator()) {
            if (!(Test-Path $entry.Value) -or (Get-Item $entry.Value).Length -le 0) {
              throw "Release asset is missing or empty: $($entry.Key)"
            }
            $hash = (Get-FileHash $entry.Value -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($entry.Key)"
          }
          $checksumLines | Set-Content -Encoding ASCII build/SHA256SUMS.txt

          gh release upload $tag `
            build/DjGoo-Host-update.zip `
            build/DjGoo-Host-update.json `
            build/DjGoo-Voice-update.zip `
            build/DjGoo-Voice-update.json `
            build/SHA256SUMS.txt `
            -R $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub rejected the repaired updater assets."
          }

          $published = gh release view $tag -R $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the repaired release."
          }
          $sizes = @{}
          foreach ($asset in $published.assets) {
            $sizes[[string]$asset.name] = [int64]$asset.size
          }
          $required = @(
            "DjGoo-Host-win-x64.zip",
            "DjGoo-Voice-win-x64.zip",
            "DjGoo-Host-update.zip",
            "DjGoo-Host-update.json",
            "DjGoo-Voice-update.zip",
            "DjGoo-Voice-update.json",
            "SHA256SUMS.txt"
          )
          $missing = @($required | Where-Object {
            !$sizes.ContainsKey($_) -or $sizes[$_] -le 0
          })
          if ($missing.Count -gt 0) {
            throw "Release is incomplete: $($missing -join ', ')"
          }

          Remove-Item published-check -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force published-check | Out-Null
          gh release download $tag -R $env:GITHUB_REPOSITORY `
            --pattern "DjGoo-Host-update.zip" `
            --pattern "DjGoo-Host-update.json" `
            --pattern "DjGoo-Voice-update.zip" `
            --pattern "DjGoo-Voice-update.json" `
            --pattern "SHA256SUMS.txt" `
            --dir published-check `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Published updater assets could not be downloaded."
          }
          foreach ($entry in @(
            @{ Published = "published-check/DjGoo-Host-update.zip"; Built = "build/DjGoo-Host-update.zip" },
            @{ Published = "published-check/DjGoo-Host-update.json"; Built = "build/DjGoo-Host-update.json" },
            @{ Published = "published-check/DjGoo-Voice-update.zip"; Built = "build/DjGoo-Voice-update.zip" },
            @{ Published = "published-check/DjGoo-Voice-update.json"; Built = "build/DjGoo-Voice-update.json" },
            @{ Published = "published-check/SHA256SUMS.txt"; Built = "build/SHA256SUMS.txt" }
          )) {
            if (
              (Get-FileHash $entry.Published -Algorithm SHA256).Hash -ne
              (Get-FileHash $entry.Built -Algorithm SHA256).Hash
            ) {
              throw "Published asset does not match the verified build: $($entry.Published)"
            }
          }

          "## Verified release $tag" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          foreach ($name in ($required | Sort-Object)) {
            $line = "$name : $($sizes[$name]) bytes"
            Write-Host $line
            "- $line" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          Write-Host "Updater-visible release verified: $tag"
