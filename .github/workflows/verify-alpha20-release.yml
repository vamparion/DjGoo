name: Verify published alpha.20 release

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-alpha20-release.yml
      - .verify-alpha20-release-trigger

permissions:
  contents: read

concurrency:
  group: verify-published-alpha20-release
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out verification tooling
        uses: actions/checkout@v4

      - name: Verify published and downloadable alpha.20 assets
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v0.3.0-alpha.20"
          $version = "0.3.0-alpha.20"
          $required = @(
            "DjGoo-Host-win-x64.zip",
            "DjGoo-Voice-win-x64.zip",
            "DjGoo-Host-update.zip",
            "DjGoo-Host-update.json",
            "DjGoo-Voice-update.zip",
            "DjGoo-Voice-update.json",
            "SHA256SUMS.txt"
          )

          $release = $null
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            $json = gh release view $tag -R $env:GITHUB_REPOSITORY --json tagName,isPrerelease,assets 2>$null
            if ($LASTEXITCODE -eq 0) {
              $candidate = $json | ConvertFrom-Json
              $sizes = @{}
              foreach ($asset in $candidate.assets) {
                $sizes[[string]$asset.name] = [int64]$asset.size
              }
              $missing = @($required | Where-Object {
                !$sizes.ContainsKey($_) -or $sizes[$_] -le 0
              })
              if ($missing.Count -eq 0) {
                $release = $candidate
                break
              }
              Write-Host "Waiting for complete $tag assets: $($missing -join ', ')"
            } else {
              Write-Host "Waiting for published release $tag."
            }
            Start-Sleep -Seconds 5
          }
          if ($null -eq $release) {
            throw "$tag was not published with all seven non-empty assets."
          }
          if ([string]$release.tagName -ne $tag -or -not [bool]$release.isPrerelease) {
            throw "Published release metadata is invalid for $tag."
          }

          Remove-Item published-alpha20 -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force published-alpha20 | Out-Null
          gh release download $tag -R $env:GITHUB_REPOSITORY `
            --pattern "DjGoo-Host-update.zip" `
            --pattern "DjGoo-Host-update.json" `
            --pattern "DjGoo-Voice-update.zip" `
            --pattern "DjGoo-Voice-update.json" `
            --pattern "SHA256SUMS.txt" `
            --dir published-alpha20 `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub would not download the published alpha.20 updater assets."
          }

          @'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          root = Path("published-alpha20")
          expected_version = "0.3.0-alpha.20"
          expected_tag = "v0.3.0-alpha.20"
          products = (
              ("DjGoo-Host-update", "DjGoo Host"),
              ("DjGoo-Voice-update", "DjGoo Voice"),
          )

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          checksums = {}
          for raw_line in (root / "SHA256SUMS.txt").read_text(encoding="ascii").splitlines():
              line = raw_line.strip()
              if not line:
                  continue
              digest, name = line.split(None, 1)
              checksums[name.strip()] = digest.lower()

          required_names = {
              "DjGoo-Host-win-x64.zip",
              "DjGoo-Voice-win-x64.zip",
              "DjGoo-Host-update.zip",
              "DjGoo-Host-update.json",
              "DjGoo-Voice-update.zip",
              "DjGoo-Voice-update.json",
          }
          assert required_names <= set(checksums), sorted(required_names - set(checksums))

          for stem, product in products:
              bundle_path = root / f"{stem}.zip"
              manifest_path = root / f"{stem}.json"
              assert bundle_path.is_file() and bundle_path.stat().st_size > 0
              assert manifest_path.is_file() and manifest_path.stat().st_size > 0
              bundle = bundle_path.read_bytes()
              manifest_bytes = manifest_path.read_bytes()
              manifest = json.loads(manifest_bytes.decode("utf-8"))

              assert manifest["product"] == product
              assert manifest["version"] == expected_version
              assert manifest["release_tag"] == expected_tag
              assert manifest["bundle_size"] == len(bundle)
              assert manifest["bundle_sha256"] == sha256(bundle)
              assert checksums[bundle_path.name] == sha256(bundle)
              assert checksums[manifest_path.name] == sha256(manifest_bytes)

              listed = {entry["path"]: entry for entry in manifest["files"]}
              assert listed
              with zipfile.ZipFile(bundle_path) as archive:
                  assert archive.testzip() is None
                  actual = {
                      info.filename
                      for info in archive.infolist()
                      if not info.is_dir()
                  }
                  assert actual == set(listed), (
                      sorted(set(listed) - actual),
                      sorted(actual - set(listed)),
                  )
                  for name, entry in listed.items():
                      data = archive.read(name)
                      assert entry["size"] == len(data), name
                      assert entry["sha256"] == sha256(data), name

          print("alpha.20 Host and Voice updater assets are downloadable and fully verified")
          '@ | Set-Content -Encoding UTF8 verify_alpha20.py

          python verify_alpha20.py
          if ($LASTEXITCODE -ne 0) {
            throw "Published alpha.20 updater verification failed."
          }

          $sizes = @{}
          foreach ($asset in $release.assets) {
            $sizes[[string]$asset.name] = [int64]$asset.size
          }
          "## Verified published release $tag" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          foreach ($name in $required) {
            "- $name : $($sizes[$name]) bytes" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          Write-Host "Published release complete and updater-visible: $tag"
