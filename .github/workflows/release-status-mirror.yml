name: Publish release stage status

on:
  workflow_run:
    workflows:
      - Fast Application Release
      - Portable Releases
      - Verify layered release assets
    types:
      - completed

permissions:
  contents: read
  statuses: write

concurrency:
  group: release-stage-status-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  record:
    # workflow_run events are generated by repository-owned workflows on main.
    # This job never checks out or executes the completed workflow's source.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_NAME: ${{ github.event.workflow_run.name }}
      SOURCE_RESULT: ${{ github.event.workflow_run.conclusion }}
      SOURCE_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Record release stage result
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $state = if ($env:SOURCE_RESULT -eq "success") { "success" } else { "failure" }
          $context = switch ($env:SOURCE_NAME) {
            "Fast Application Release" { "DjGoo/fast-app-release" }
            "Portable Releases" { "DjGoo/portable-release" }
            "Verify layered release assets" { "DjGoo/layered-release-verifier" }
            default { throw "Unknown release workflow: $env:SOURCE_NAME" }
          }
          $description = if ($state -eq "success") {
            "$env:SOURCE_NAME passed"
          } else {
            "$env:SOURCE_NAME ended with $env:SOURCE_RESULT"
          }
          gh api --method POST `
            "repos/$env:GITHUB_REPOSITORY/statuses/$env:SOURCE_SHA" `
            -f state=$state `
            -f context=$context `
            -f description=$description `
            -f target_url=$env:SOURCE_URL
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish $context status for $env:SOURCE_SHA"
          }
