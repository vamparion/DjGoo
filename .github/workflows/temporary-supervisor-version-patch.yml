name: Temporary supervisor version migration patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-supervisor-version-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/restart-stale-supervisor-after-update
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Patch source files
        run: python tools/patch_supervisor_version_migration.py

      - name: Commit branch patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/djgoo_launcher.py tools/djgoo_stack.py tools/apply_update.py
          if git diff --cached --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git commit -m "restart stale supervisor after updates"
          git push origin HEAD:agent/restart-stale-supervisor-after-update
