name: Temporary Lavalink test contract patch

# Second commit triggers this workflow after GitHub registers it on main.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-lavalink-test-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-known-good-managed-lavalink
          token: ${{ github.token }}
          fetch-depth: 0
      - run: python tools/patch_lavalink_test_contract.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_portable_red_setup.py tests/test_portable_stack_adapter.py
          git commit -m "update tests for Lavalink readiness contract"
          git push origin HEAD:agent/restore-known-good-managed-lavalink
