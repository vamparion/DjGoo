name: Temporary Alpha2 Status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-alpha2-status.yml

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report current release runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --limit 20 --json databaseId,workflowName,status,conclusion,headBranch,headSha,createdAt,url)"
          body="$(jq -n --argjson runs "$runs" --arg sha "59a3b8dd3410ec45ee813f3ce332fc4678a4ca47" '{merge_sha:$sha,runs:$runs}')"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Alpha2 release verification 59a3b8dd" --body "\`\`\`json
          $body
          \`\`\`"
